<h1>Privacy Policy</h1>
<p><strong>Last updated:</strong> February 18, 2026</p>
<p>This Privacy Policy describes how Crypto Meme 2048 ("we", "us", or "the App") handles information when you use our mobile application.</p>

<h2>1. Information We Collect</h2>
<p>Crypto Meme 2048 is a fully offline, single-player game. <strong>We do not collect, store, transmit, or share any personal information.</strong></p>
<ul>
  <li>We do not require account registration or login.</li>
  <li>We do not collect names, email addresses, phone numbers, or any other personal identifiers.</li>
  <li>We do not use analytics, tracking, or advertising SDKs.</li>
  <li>We do not access your contacts, camera, microphone, location, or any other device sensors (except the vibration motor for optional haptic feedback).</li>
</ul>

<h2>2. Locally Stored Data</h2>
<p>The App stores the following data locally on your device only:</p>
<ul>
  <li><strong>High Score:</strong> Your best game score.</li>
  <li><strong>Settings Preferences:</strong> Sound and vibration toggle states.</li>
</ul>
<p>This data is stored using Android's DataStore mechanism and never leaves your device. You can clear this data at any time by clearing the App's data or uninstalling it.</p>

<h2>3. Third-Party Services</h2>
<p>The App does not integrate any third-party services, SDKs, analytics platforms, or advertising networks.</p>

<h2>4. Children's Privacy</h2>
<p>The App does not collect personal information from anyone, including children under the age of 13. The App is safe for all ages.</p>

<h2>5. Data Security</h2>
<p>Since we do not collect or transmit any data, there is no risk of data breach or unauthorized access to your information through our App.</p>

<h2>6. Changes to This Policy</h2>
<p>We may update this Privacy Policy from time to time. Any changes will be reflected by updating the "Last updated" date at the top of this page. We encourage you to review this page periodically.</p>

<h2>7. Contact Us</h2>
<p>If you have any questions about this Privacy Policy, please contact us at:</p>
<p>Email: <a href="mailto:cryptomeme2048@gmail.com">cryptomeme2048@gmail.com</a></p>
